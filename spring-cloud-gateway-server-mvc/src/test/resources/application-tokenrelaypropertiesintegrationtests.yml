spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: token_relay_test
            uri: https://examplel1.com
            filters:
              - TokenRelay=relay
  security:
    oauth2:
      client:
        provider:
          relay:
            jwk-set-uri: https://localhost:8080/context/path/jwk
            issuer-uri: https://localhost:8080/context/path/issuer
        registration:
          relay:
            provider: relay
            client-authentication-method: client_secret_post
            authorization-grant-type: client_credentials
            client-id: someClientId
            client-secret: someClientSecret

logging:
  level:
    org.springframework.cloud.gateway.server.mvc: TRACE
